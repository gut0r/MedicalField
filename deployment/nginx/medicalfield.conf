limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

server {
    listen 80;
    server_name medicalfield.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name medicalfield.example.com;

    ssl_certificate /etc/letsencrypt/live/medicalfield.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medicalfield.example.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 2m;

    root /var/www/medicalfield/portal;
    location / { try_files $uri $uri/ /index.html; }

    location /field/ {
        alias /var/www/medicalfield/field/;
        try_files $uri $uri/ /field/index.html;
        add_header Cache-Control "no-cache";
    }
    location = /field/sw.js { alias /var/www/medicalfield/field/sw.js; add_header Cache-Control "no-store"; }

    location = /documentation { return 301 /documentation/; }
    location ^~ /documentation/ {
        auth_basic "MedicalField API Docs";
        auth_basic_user_file /etc/nginx/.medicalfield-docs.htpasswd;
        alias /var/www/medicalfield/api-docs/;
        index index.html;
        add_header Cache-Control "no-store";
    }

    # Swagger passa por uma segunda credencial HTTP criada na implantacao.
    location ~ ^/api/patients/(swagger-ui|v3/api-docs) {
        auth_basic "MedicalField API Docs";
        auth_basic_user_file /etc/nginx/.medicalfield-docs.htpasswd;
        rewrite ^/api/patients/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8081;
    }
    location ~ ^/api/sync/(swagger-ui|v3/api-docs) {
        auth_basic "MedicalField API Docs";
        auth_basic_user_file /etc/nginx/.medicalfield-docs.htpasswd;
        rewrite ^/api/sync/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8082;
    }

    location = /api/auth/docs {
        auth_basic "MedicalField API Docs";
        auth_basic_user_file /etc/nginx/.medicalfield-docs.htpasswd;
        rewrite ^ /docs break;
        proxy_set_header Accept-Encoding "";
        proxy_pass http://127.0.0.1:8001;
        sub_filter "url: '/openapi.json'" "url: '/api/auth/openapi.json'";
        sub_filter_once off;
        proxy_hide_header ETag;
        add_header Cache-Control "no-store";
    }
    location = /api/auth/openapi.json { auth_basic "MedicalField API Docs"; auth_basic_user_file /etc/nginx/.medicalfield-docs.htpasswd; rewrite ^ /openapi.json break; proxy_pass http://127.0.0.1:8001; }
    location = /api/medications/docs {
        auth_basic "MedicalField API Docs";
        auth_basic_user_file /etc/nginx/.medicalfield-docs.htpasswd;
        rewrite ^ /docs break;
        proxy_set_header Accept-Encoding "";
        proxy_pass http://127.0.0.1:8002;
        sub_filter "url: '/openapi.json'" "url: '/api/medications/openapi.json'";
        sub_filter_once off;
        proxy_hide_header ETag;
        add_header Cache-Control "no-store";
    }
    location = /api/medications/openapi.json { auth_basic "MedicalField API Docs"; auth_basic_user_file /etc/nginx/.medicalfield-docs.htpasswd; rewrite ^ /openapi.json break; proxy_pass http://127.0.0.1:8002; }
    location ^~ /api/records/docs/ { auth_basic "MedicalField API Docs"; auth_basic_user_file /etc/nginx/.medicalfield-docs.htpasswd; rewrite ^/api/records/(.*)$ /$1 break; proxy_pass http://127.0.0.1:3001; }
    location = /api/records/docs { return 301 /api/records/docs/; }
    location ^~ /api/documents/docs/ { auth_basic "MedicalField API Docs"; auth_basic_user_file /etc/nginx/.medicalfield-docs.htpasswd; rewrite ^/api/documents/(.*)$ /$1 break; proxy_pass http://127.0.0.1:3002; }
    location = /api/documents/docs { return 301 /api/documents/docs/; }

    location ^~ /api/auth/login { limit_req zone=login_limit burst=5 nodelay; rewrite ^/api/(.*)$ /$1 break; proxy_pass http://127.0.0.1:8001; include proxy_params; }
    location ~ ^/api/(auth|professionals)(/|$) { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://127.0.0.1:8001; include proxy_params; }
    location ~ ^/api/patients(/|$) { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://127.0.0.1:8081; include proxy_params; }
    location ~ ^/api/(medical-records|encounters)(/|$) { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://127.0.0.1:3001; include proxy_params; }
    location ~ ^/api/(medications|medication-changes)(/|$) { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://127.0.0.1:8002; include proxy_params; }
    location ~ ^/api/(sync|audit)(/|$) { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://127.0.0.1:8082; include proxy_params; }
    location ^~ /api/documents/ { rewrite ^/api/documents/(.*)$ /$1 break; proxy_pass http://127.0.0.1:3002; include proxy_params; }
}
